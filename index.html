<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Orb — the solar system has no center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/svg+xml" href="./orb.svg">
  <link rel="apple-touch-icon" href="./orb.svg">

  <meta name="author" content="plutoniumm">
  <meta name="description"
    content="A Newtonian solar-system simulation showing that physics doesn't change with what you treat as the center. Pick any planet as the origin — the result is the same.">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Orb">
  <meta property="og:description"
    content="A Newtonian solar-system simulation showing the solar system has no center.">

  <!-- analytics on plutoniumm.github.io -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "6dd90a981e8b47dd9725e27e28491525"}'></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; }
    #view {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: crosshair;
    }
    #view:focus { outline: none; }
    #loader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #05060a;
      transition: opacity .5s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #1b2030;
      border-top-color: #4dc3ff;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <canvas id="view"></canvas>
  <div id="loader"><div class="ring"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
