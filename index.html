<body class="f j-ct al-ct p-rel" style="height: 100vh;width: 100vw;">
  <div class="h-100 w-100" id="warning">
    <div class="scene center">
      <div id="trail" class="trail center"></div>
      <div class="orbit center"></div>
      <div id="sun" class="sun"></div>
    </div>
  </div>
</body>

<script>
  const cx = 500, cy = 500;
  const r = 320;

  function percent ( p ) {
    const t = Math.max( 0, Math.min( 100, p ) ) / 100;
    const angle = t * Math.PI * 2 - Math.PI / 2; // start at top
    const x = cx + r * Math.cos( angle );
    const y = cy + r * Math.sin( angle );

    sun.style.left = `${ x }px`;
    sun.style.top = `${ y }px`;

    const deg = t * 360;
    trail.style.background = `conic-gradient(#fff8 ${ deg }deg, transparent 0deg)`;
  }

  function patch ( name ) {
    return fetch( name ).then( response => {
      if ( !response.ok || !response.body ) {
        throw Error( `Failed to fetch ${ name }` );
      }

      const contentLength = response.headers.get( 'Content-Length' );
      if ( !contentLength ) {
        console.warn( 'Content-Length response header unavailable' );
        return response;
      }

      const total = parseInt( contentLength, 10 );
      let loaded = 0;

      const reader = response.body.getReader();
      const stream = new ReadableStream( {
        start ( controller ) {
          function read () {
            reader.read().then( ( { done, value } ) => {
              if ( done ) {
                controller.close();
                return;
              }
              loaded += value.byteLength;
              percent( ( loaded / total ) * 100 );
              controller.enqueue( value );
              read();
            } ).catch( error => {
              console.error( 'Error while reading:', error );
              controller.error( error );
            } );
          };

          read();
        }
      } );

      return new Response( stream, { headers: response.headers } );
    } );
  }
</script>

<script type="module">
  import init from './build/orb.js';

  init()
    .catch( ( error ) => {
      if ( !error.message.includes( "This isn't actually an error!" ) ) {
        throw error;
      }
    } )
    .then( () => document.getElementById( 'warning' ).remove() );
</script>
